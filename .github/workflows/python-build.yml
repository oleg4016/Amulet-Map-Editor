name: Build

on:
  release:
    types: [published]
  workflow_dispatch: # Кнопка ручного запуска теперь будет видна

jobs:
  deploy:
    runs-on: windows-latest # Собираем под Windows
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: '3.10'
            architecture: x64

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        architecture: ${{ matrix.architecture }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel pyinstaller~=5.6 build

    - name: Build Package
      run: |
        export BDISTWHEELFREEZELIBS=true
        python -m build
        # Установка собранного wheel, чтобы PyInstaller видел все зависимости
        python -m pip install dist/amulet_map_editor-*.whl --upgrade

    - name: PyInstaller build
      run: |
        # Задаем имя файла. Если это не релиз, используем имя 'manual'
        TAG_NAME="${{ github.event.release.tag_name }}"
        if [ -z "$TAG_NAME" ]; then TAG_NAME="manual"; fi
        
        BUILT_FILENAME="Amulet-v${TAG_NAME}-Windows-x64.zip"
        echo "BUILT_PATH=$BUILT_FILENAME" >> $GITHUB_ENV
        
        # Запуск сборки через PyInstaller
        python -m PyInstaller -y Amulet.spec
        
        # Упаковка в ZIP (используем 7z, который есть в Windows-раннерах)
        cd dist
        7z a "$BUILT_FILENAME" Amulet
        cd ..

    - name: Upload Release Asset (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: Amulet-Build-Windows
        path: ./dist/${{env.BUILT_PATH}}
        retention-days: 5

    # Этот шаг закомментирован, так как он требует секретных ключей PyPi
